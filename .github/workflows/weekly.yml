name: weekly-matrix-round
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
jobs:
  round:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      HITL_MODE: file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: matrix-flow || true
      - name: Open a PR with pending decisions
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Matrix round: decisions pending"
          body: "Review data/pending/*.json, set decided: true, merge, then re-run the workflow to resume."
          branch: matrix-round
